  </defs>
  <text
    x="190"
    y="56"
    text-anchor="middle"
    font-family="'Franklin Gothic Medium', 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif"
    font-size="62"
    font-weight="900"
    font-style="italic"
